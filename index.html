<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUDIO TEST LOG ANALYZER</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --blue: #2563eb;
    --red: #dc2626;
    --green: #16a34a;
    --bg: #f3f6fa;
    --card: #ffffff;
    --border: #dfe5ec;
    --text: #1f2937;
    --muted: #64748b;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    height: 68px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
}

.header-title h1 {
    margin: 0;
    font-size: 21px;
}

.header-title p {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--muted);
}

.upload-button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
}

#fileInput {
    display: none;
}

#startScreen {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.upload-card {
    width: 520px;
    max-width: 100%;
    background: white;
    border: 2px dashed #b9c4d0;
    border-radius: 14px;
    padding: 55px 30px;
    text-align: center;
}

.upload-card h2 {
    margin: 0 0 10px;
}

.upload-card p {
    color: var(--muted);
    font-size: 14px;
}

.upload-main-button {
    margin-top: 15px;
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    background: var(--blue);
    color: white;
    cursor: pointer;
    font-weight: bold;
}

#app {
    display: none;
    height: calc(100vh - 68px);
}

.app-layout {
    display: grid;
    grid-template-columns: 440px 1fr;
    height: 100%;
}

/* SIDEBAR */

.sidebar {
    background: white;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 15px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.sidebar-title {
    font-size: 15px;
    font-weight: bold;
}

.total-count {
    font-size: 11px;
    color: var(--muted);
}

.filter-label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-size: 9px;
    font-weight: bold;
    color: var(--muted);
}

.station-select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
}

.status-filters {
    display: flex;
    gap: 6px;
}

.status-filter {
    flex: 1;
    border: 1px solid var(--border);
    background: #f8fafc;
    padding: 8px 5px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.status-filter.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

.search-box textarea {
    width: 100%;
    min-height: 75px;
    resize: vertical;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
}

/* SN TABLE */

.sn-table-header,
.sn-row {
    display: grid;
    grid-template-columns: 28px 1.2fr 1fr 62px 1.2fr 18px;
    gap: 4px;
    align-items: center;
}

.sn-table-header {
    padding: 10px 8px;
    font-size: 8px;
    color: var(--muted);
    font-weight: bold;
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
}

.sn-list {
    flex: 1;
    overflow-y: auto;
}

.sn-row {
    min-height: 58px;
    padding: 7px 8px;
    border-bottom: 1px solid #edf0f3;
    font-size: 9px;
    cursor: pointer;
}

.sn-row:hover {
    background: #f8fafc;
}

.sn-row.selected {
    background: #eaf2ff;
    box-shadow: inset 3px 0 0 var(--blue);
}

.sn-number {
    color: var(--muted);
}

.sn-pcba {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sn-station {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #475569;
}

.status-badge {
    display: inline-block;
    padding: 5px 6px;
    border-radius: 4px;
    font-size: 8px;
    font-weight: bold;
    color: white;
}

.status-pass {
    background: var(--green);
}

.status-ng {
    background: var(--red);
}

.ng-details {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #475569;
}

.arrow {
    color: var(--blue);
    font-size: 16px;
}

/* MAIN CONTENT */

.content {
    overflow-y: auto;
    padding: 14px 18px 25px;
}

/* VIEW MODE */

.view-mode-section {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
}

.view-mode-button {
    border: 1px solid var(--border);
    background: white;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.view-mode-button.active {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
}

/* INFO BAR */

.info-bar {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    align-items: stretch;
    margin-bottom: 12px;
    overflow: hidden;
    flex-wrap: wrap;
}

.info-item {
    padding: 15px 18px;
    min-width: 145px;
    border-right: 1px solid #e9edf2;
}

.info-label {
    font-size: 9px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 7px;
}

.info-value {

}

.result-pass {
    color: var(--green);
}

.result-ng {

}

.ng-summary {
    flex: 1;
    padding: 14px 18px;
}

.ng-summary-title {
    font-size: 9px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 8px;
}

.ng-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.ng-pill {
    background: #f8fafc;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 9px;
}

.ng-pill span {
    color: var(--red);
    font-weight: bold;
    margin-left: 4px;
}

/* STATION SUMMARY */

.station-summary {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 16px;
    margin-bottom: 12px;
}

.station-summary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.station-summary-title {
    font-size: 14px;
    font-weight: bold;
}

.station-summary-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
}

.summary-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.summary-stat {
    min-width: 100px;
    background: #f8fafc;
    border-radius: 6px;
    padding: 11px;
}

.summary-stat-label {
    font-size: 8px;
    color: var(--muted);
    font-weight: bold;
}

.summary-stat-value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.summary-good {
    color: var(--green);
}

.summary-ng {
    color: var(--red);
}

.test-ng-summary {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.test-ng-item {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 10px;
    background: white;
}

.test-ng-item b {
    color: var(--red);
    margin-left: 5px;
}

/* TEST FILTER */

.test-filter-section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 12px;
}

.test-filter-title {
    font-size: 10px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 9px;
}

.test-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.test-tab {
    border: 1px solid var(--border);
    background: #f1f5f9;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.test-tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

/* GRAPHS */

.graphs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.graph-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    min-height: 350px;
}

.graph-card.expanded {
    grid-column: 1 / -1;
    min-height: calc(100vh - 310px);
}

.graph-title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
}

.canvas-wrapper {
    height: 290px;
    position: relative;
}

.graph-card.expanded .canvas-wrapper {
    height: calc(100vh - 390px);
    min-height: 450px;
}

.no-graph {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 70px;
    text-align: center;
    color: var(--muted);
}

.footer-note {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 12px;
}

@media (max-width: 1150px) {
    .app-layout {
        grid-template-columns: 390px 1fr;
    }
}

@media (max-width: 850px) {

    #app {
        height: auto;
    }

    .app-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        height: 600px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    .graphs {
        grid-template-columns: 1fr;
    }

}

</style>

<body>

<header>

    <div class="header-title">
        <h1>AUDIO TEST LOG ANALYZER</h1>
        <p>Audio SPC CSV • Station Comparison • Unit & Station Summary</p>
    </div>

    <label class="upload-button">
        ⇧ Upload New CSV
        <input type="file" id="fileInput" accept=".csv">
    </label>

</header>

<div id="startScreen">

    <div class="upload-card">

        <h2>Upload Audio SPC CSV</h2>

        <p>
            Upload your Audio SPC CSV containing DUT measurements and StationIP.
        </p>

        <button
            class="upload-main-button"
            onclick="document.getElementById('fileInput').click()">

            Choose CSV File

        </button>

    </div>

</div>

<div id="app">

<div class="app-layout">

<aside class="sidebar">

    <div class="sidebar-header">

        <div class="sidebar-title-row">

            <div class="sidebar-title">
                ▌ ALL SN / DUT LIST
            </div>

            <div class="total-count" id="totalCount">
                Total: 0
            </div>

        </div>

        <label class="filter-label">
            STATION IP
        </label>

        <select id="stationFilter" class="station-select"></select>

        <label class="filter-label">
            STATUS
        </label>

        <div class="status-filters">

            <button class="status-filter active" data-status="ALL">
                ALL
            </button>

            <button class="status-filter" data-status="PASS">
                GOOD
            </button>

            <button class="status-filter" data-status="NG">
                NG
            </button>

        </div>

        <label class="filter-label">
            SEARCH SN / PCBA
        </label>

        <div class="search-box">

            <textarea
                id="searchInput"
                placeholder="Paste one or multiple SN here...
Comma, space, semicolon or new line supported"></textarea>

        </div>

    </div>

    <div class="sn-table-header">

        <div>#</div>
        <div>PCBA / SN</div>
        <div>STATION IP</div>
        <div>STATUS</div>
        <div>NG DETAILS</div>
        <div></div>

    </div>

    <div class="sn-list" id="snList"></div>

</aside>

<main class="content">

<div class="view-mode-section">

    <button class="view-mode-button active" data-view="UNIT">
        UNIT VIEW
    </button>

    <button class="view-mode-button" data-view="STATION">
        STATION SUMMARY
    </button>

</div>

<div id="unitView"></div>

<div id="stationView" style="display:none;"></div>

</main>

</div>

</div>

<script>

let csvData = [];
let headers = [];

let lowerRow = null;
let upperRow = null;

let dutRows = [];
let filteredRows = [];

let selectedDutIndex = 0;

let activeTest = "ALL";
let activeStatus = "ALL";
let activeStation = "ALL";
let activeView = "UNIT";

let stationColumn = -1;

let charts = [];


/* FILE */

document
.getElementById("fileInput")
.addEventListener("change", handleFile);


function handleFile(event) {

    const file = event.target.files[0];

    if (!file) return;

    Papa.parse(file, {

        header: false,
        skipEmptyLines: true,

        complete: function(results) {

            csvData = results.data;

            processCSV();

        }

    });

}


/* PROCESS CSV */

function processCSV() {

    if (csvData.length < 3) {

        alert("Invalid CSV.");

        return;

    }

    headers = csvData[0];

    lowerRow = findRow("Lower");
    upperRow = findRow("Upper");

    stationColumn =
        headers.findIndex(header =>
            String(header || "")
            .trim()
            .toLowerCase() === "stationip"
        );

    if (stationColumn === -1) {

        alert("StationIP column was not found.");

        return;

    }

    dutRows =
        csvData
        .slice(1)
        .filter(row => {

            const first =
                String(row[0] || "")
                .trim()
                .toLowerCase();

            if (!first) return false;

            const excluded = [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cpk"
            ];

            return !excluded.includes(first);

        });

    dutRows.forEach(row => {

        row._analysis =
            analyzeDUT(row);

    });

    populateStationFilter();

    applyFilters();

    document
    .getElementById("startScreen")
    .style.display = "none";

    document
    .getElementById("app")
    .style.display = "block";

    if (dutRows.length > 0) {

        selectDUT(0);

    }

}


/* FIND LOWER / UPPER */

function findRow(name) {

    return csvData.find(row =>
        String(row[0] || "")
        .trim()
        .toLowerCase() === name.toLowerCase()
    );

}


/* ANALYZE DUT */

function analyzeDUT(row) {

    const groups =
        detectMeasurementGroups(row);

    const summary = {};

    let totalNG = 0;

    Object.keys(groups)
    .forEach(group => {

        let ngCount = 0;

        groups[group].forEach(item => {

            if (isNG(item)) {

                ngCount++;
                totalNG++;

            }

        });

        summary[group] = {

            ngCount,

            status:
                ngCount > 0
                ? "NG"
                : "PASS"

        };

    });

    const failedTests =
        Object.keys(summary)
        .filter(
            group =>
                summary[group].ngCount > 0
        );

    return {

        groups,
        summary,
        totalNG,
        failedTests,

        result:
            totalNG > 0
            ? "NG"
            : "PASS"

    };

}


/* DETECT MEASUREMENTS */

function detectMeasurementGroups(row) {

    const groups = {};

    for (let i = 0; i < headers.length; i++) {

        const header =
            String(headers[i] || "").trim();

        if (!header) continue;

        const upperHeader =
            header.toUpperCase();

        if (
            !upperHeader.includes("MIC")
            &&
            !upperHeader.includes("SPK")
        ) {
            continue;
        }

        const info =
            parseMeasurementHeader(upperHeader);

        if (!info) continue;

        let value = toNumber(row[i]);

        let lower =
            toNumber(lowerRow?.[i]);

        let upper =
            toNumber(upperRow?.[i]);

        if (info.group === "F_MB_MIC_SEAL") {

            const limits =
                getMicSealLimits();

            if (limits.lower !== null) {
                lower = limits.lower;
            }

            if (limits.upper !== null) {
                upper = limits.upper;
            }

        }

        if (
            value === null
            &&
            lower === null
            &&
            upper === null
        ) {
            continue;
        }

        if (!groups[info.group]) {
            groups[info.group] = [];
        }

        groups[info.group].push({

            column: i,
            header,
            frequency: info.frequency,
            value,
            lower,
            upper

        });

    }

    Object.values(groups)
    .forEach(items => {

        items.sort(
            (a, b) =>
                a.frequency - b.frequency
        );

    });

    return groups;

}


/* MIC SEAL LIMITS */

function getMicSealLimits() {

    let firstLower = null;
    let firstUpper = null;

    for (let i = 0; i < headers.length; i++) {

        const header =
            String(headers[i] || "")
            .toUpperCase();

        if (!header.startsWith("F_MB_MIC_SEAL")) {
            continue;
        }

        const lower =
            toNumber(lowerRow?.[i]);

        const upper =
            toNumber(upperRow?.[i]);

        if (
            firstLower === null
            &&
            lower !== null
        ) {
            firstLower = lower;
        }

        if (
            firstUpper === null
            &&
            upper !== null
        ) {
            firstUpper = upper;
        }

    }

    return {

        lower: firstLower,
        upper: firstUpper

    };

}


/* PARSE HEADER */

function parseMeasurementHeader(header) {

    const match =
        header.match(/_(\d+(?:\.\d+)?)$/);

    let group = header;
    let frequency = 0;

    if (match) {

        frequency =
            Number(match[1]);

        group =
            header.replace(
                /_(\d+(?:\.\d+)?)$/,
                ""
            );

    }

    return {

        group,
        frequency

    };

}


/* NG CHECK */

function isNG(item) {

    if (item.value === null) {
        return false;
    }

    if (
        item.lower !== null
        &&
        item.value < item.lower
    ) {
        return true;
    }

    if (
        item.upper !== null
        &&
        item.value > item.upper
    ) {
        return true;
    }

    return false;

}


/* STATION FILTER */

function populateStationFilter() {

    const select =
        document.getElementById("stationFilter");

    const stations =
        [...new Set(
            dutRows
            .map(row =>
                String(row[stationColumn] || "").trim()
            )
            .filter(Boolean)
        )]
        .sort();

    select.innerHTML =
        `<option value="ALL">
            ALL STATIONS
        </option>`;

    stations.forEach(station => {

        const option =
            document.createElement("option");

        option.value = station;
        option.textContent = station;

        select.appendChild(option);

    });

    select.onchange = function() {

        activeStation = this.value;

        applyFilters();

    };

}


/* STATUS FILTER */

document
.querySelectorAll(".status-filter")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            activeStatus =
                this.dataset.status;

            document
            .querySelectorAll(".status-filter")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            applyFilters();

        }
    );

});


/* MULTIPLE SEARCH */

document
.getElementById("searchInput")
.addEventListener("input", function() {

    applyFilters();

});


/* APPLY FILTERS */

function applyFilters() {

    const searchText =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const searchTerms =
        searchText
        ? searchText
            .split(/[\s,;]+/)
            .filter(Boolean)
        : [];

    filteredRows =
        dutRows.filter(row => {

            const analysis =
                row._analysis;

            const station =
                String(row[stationColumn] || "").trim();

            const sn =
                String(row[0] || "")
                .toLowerCase();

            const work =
                String(row[1] || "")
                .toLowerCase();

            if (
                activeStation !== "ALL"
                &&
                station !== activeStation
            ) {
                return false;
            }

            if (
                activeStatus !== "ALL"
                &&
                analysis.result !== activeStatus
            ) {
                return false;
            }

            if (searchTerms.length > 0) {

                const found =
                    searchTerms.some(term =>
                        sn.includes(term)
                        ||
                        work.includes(term)
                    );

                if (!found) {
                    return false;
                }

            }

            return true;

        });

    renderSidebar();

    if (filteredRows.length > 0) {

        const selected =
            dutRows[selectedDutIndex];

        if (!filteredRows.includes(selected)) {

            selectedDutIndex =
                dutRows.indexOf(filteredRows[0]);

        }

        if (activeView === "UNIT") {

            renderUnitView();

        }

    }

    if (activeView === "STATION") {

        renderStationView();

    }

}


/* SIDEBAR */

function renderSidebar() {

    document
    .getElementById("totalCount")
    .textContent =
        `Total: ${filteredRows.length}`;

    const list =
        document.getElementById("snList");

    list.innerHTML = "";

    filteredRows.forEach(row => {

        const actualIndex =
            dutRows.indexOf(row);

        const analysis =
            row._analysis;

        const item =
            document.createElement("div");

        item.className = "sn-row";

        if (actualIndex === selectedDutIndex) {

            item.classList.add("selected");

        }

        const failedNames =
            analysis.failedTests
            .map(formatGroupName)
            .join(", ");

        item.innerHTML = `

            <div class="sn-number">
                ${actualIndex + 1}
            </div>

            <div class="sn-pcba">
                ${escapeHTML(row[0] || "-")}
            </div>

            <div class="sn-station">
                ${escapeHTML(row[stationColumn] || "-")}
            </div>

            <div>

                <span class="
                    status-badge
                    ${
                        analysis.result === "PASS"
                        ? "status-pass"
                        : "status-ng"
                    }
                ">

                    ${
                        analysis.result === "PASS"
                        ? "GOOD"
                        : `NG (${analysis.totalNG})`
                    }

                </span>

            </div>

            <div class="ng-details">

                ${
                    failedNames
                    ? escapeHTML(failedNames)
                    : "-"
                }

            </div>

            <div class="arrow">
                ›
            </div>

        `;

        item.onclick = function() {

            selectDUT(actualIndex);

        };

        list.appendChild(item);

    });

}


/* SELECT DUT */

function selectDUT(index) {

    selectedDutIndex = index;

    if (activeView === "UNIT") {

        renderUnitView();

    }

    renderSidebar();

}


/* VIEW MODE */

document
.querySelectorAll(".view-mode-button")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            activeView =
                this.dataset.view;

            document
            .querySelectorAll(".view-mode-button")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            if (activeView === "UNIT") {

                document
                .getElementById("unitView")
                .style.display = "block";

                document
                .getElementById("stationView")
                .style.display = "none";

                renderUnitView();

            } else {

                document
                .getElementById("unitView")
                .style.display = "none";

                document
                .getElementById("stationView")
                .style.display = "block";

                renderStationView();

            }

        }
    );

});


/* UNIT VIEW */

function renderUnitView() {

    destroyCharts();

    const container =
        document.getElementById("unitView");

    const row =
        dutRows[selectedDutIndex];

    if (!row) {

        container.innerHTML =
            `<div class="no-graph">
                No DUT selected.
            </div>`;

        return;

    }

    const analysis =
        row._analysis;

    container.innerHTML = `

        <div class="info-bar">

            <div class="info-item">

                <div class="info-label">
                    PCBA / SN
                </div>

                <div class="info-value">
                    ${escapeHTML(row[0] || "-")}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    STATION IP
                </div>

                <div class="info-value">
                    ${escapeHTML(row[stationColumn] || "-")}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    OVERALL RESULT
                </div>

                <div class="
                    info-value
                    ${
                        analysis.result === "PASS"
                        ? "result-pass"
                        : "result-ng"
                    }
                ">

                    ${
                        analysis.result === "PASS"
                        ? "GOOD"
                        : `NG (${analysis.totalNG})`
                    }

                </div>

            </div>

            <div class="ng-summary">

                <div class="ng-summary-title">
                    NG SUMMARY
                </div>

                <div
                    class="ng-pills"
                    id="unitNGSummary">
                </div>

            </div>

        </div>

        <div class="test-filter-section">

            <div class="test-filter-title">
                SELECT TEST TO DISPLAY
            </div>

            <div
                class="test-tabs"
                id="unitTestTabs">
            </div>

        </div>

        <div
            class="graphs"
            id="unitGraphs">
        </div>

    `;

    renderUnitNGSummary(analysis);

    renderTestTabs(
        "unitTestTabs",
        analysis.groups,
        function() {

            renderUnitView();

        }
    );

    renderUnitGraphs(analysis.groups);

}


/* UNIT NG SUMMARY */

function renderUnitNGSummary(analysis) {

    const container =
        document.getElementById("unitNGSummary");

    Object.keys(analysis.summary)
    .forEach(group => {

        const data =
            analysis.summary[group];

        const pill =
            document.createElement("div");

        pill.className = "ng-pill";

        pill.innerHTML = `

            ${formatGroupName(group)}

            <span>
                ${data.ngCount}
            </span>

        `;

        container.appendChild(pill);

    });

}


/* TEST TABS */

function renderTestTabs(
    containerID,
    groups,
    callback
) {

    const container =
        document.getElementById(containerID);

    container.innerHTML = "";

    let groupKeys =
        Object.keys(groups);

    if (
        activeTest !== "ALL"
        &&
        !groupKeys.includes(activeTest)
    ) {

        activeTest = "ALL";

    }

    createTestButton(
        container,
        "ALL TESTS",
        "ALL",
        callback
    );

    groupKeys.forEach(group => {

        createTestButton(
            container,
            formatGroupName(group),
            group,
            callback
        );

    });

}


function createTestButton(
    container,
    label,
    test,
    callback
) {

    const button =
        document.createElement("button");

    button.className = "test-tab";

    if (activeTest === test) {

        button.classList.add("active");

    }

    button.textContent = label;

    button.onclick = function() {

        activeTest = test;

        callback();

    };

    container.appendChild(button);

}


/* UNIT GRAPHS */

function renderUnitGraphs(groups) {

    const container =
        document.getElementById("unitGraphs");

    container.innerHTML = "";

    let groupKeys =
        Object.keys(groups);

    if (activeTest !== "ALL") {

        groupKeys =
            groupKeys.filter(
                group => group === activeTest
            );

    }

    groupKeys.forEach((group, index) => {

        const card =
            document.createElement("div");

        card.className = "graph-card";

        if (activeTest !== "ALL") {

            card.classList.add("expanded");

        }

        card.innerHTML = `

            <div class="graph-title">
                ${formatGroupName(group)}
            </div>

            <div class="canvas-wrapper">

                <canvas
                    id="unitChart_${index}">
                </canvas>

            </div>

        `;

        container.appendChild(card);

        createUnitChart(
            document.getElementById(
                `unitChart_${index}`
            ),
            groups[group]
        );

    });

}


/* STATION VIEW */

function renderStationView() {

    destroyCharts();

    const container =
        document.getElementById("stationView");

    const rows =
        filteredRows;

    if (rows.length === 0) {

        container.innerHTML =
            `<div class="no-graph">
                No units available for the selected filters.
            </div>`;

        return;

    }

    const stationName =
        activeStation === "ALL"
        ? "ALL STATIONS"
        : activeStation;

    const total =
        rows.length;

    const good =
        rows.filter(
            row =>
                row._analysis.result === "PASS"
        ).length;

    const ng =
        total - good;

    const groupSummary =
        calculateGroupSummary(rows);

    container.innerHTML = `

        <div class="station-summary">

            <div class="station-summary-header">

                <div>

                    <div class="station-summary-title">
                        STATION SUMMARY:
                        ${escapeHTML(stationName)}
                    </div>

                    <div class="station-summary-subtitle">
                        Compiled from ${total} filtered unit(s)
                    </div>

                </div>

            </div>

            <div class="summary-stats">

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        TOTAL UNITS
                    </div>

                    <div class="summary-stat-value">
                        ${total}
                    </div>

                </div>

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        GOOD
                    </div>

                    <div class="
                        summary-stat-value
                        summary-good">

                        ${good}

                    </div>

                </div>

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        NG
                    </div>

                    <div class="
                        summary-stat-value
                        summary-ng">

                        ${ng}

                    </div>

                </div>

            </div>

            <div
                class="test-ng-summary"
                id="stationNGSummary">
            </div>

        </div>

        <div class="test-filter-section">

            <div class="test-filter-title">
                SELECT COMPILED TEST GRAPH
            </div>

            <div
                class="test-tabs"
                id="stationTestTabs">
            </div>

        </div>

        <div
            class="graphs"
            id="stationGraphs">
        </div>

    `;

    renderStationNGSummary(groupSummary);

    const allGroups =
        getAllGroups(rows);

    renderStationTestTabs(
        allGroups,
        function() {

            renderStationView();

        }
    );

    renderStationGraphs(
        rows,
        allGroups
    );

}


/* GROUP SUMMARY */

function calculateGroupSummary(rows) {

    const summary = {};

    rows.forEach(row => {

        Object.keys(
            row._analysis.summary
        )
        .forEach(group => {

            if (!summary[group]) {

                summary[group] = 0;

            }

            summary[group] +=
                row
                ._analysis
                .summary[group]
                .ngCount;

        });

    });

    return summary;

}


/* STATION NG SUMMARY */

function renderStationNGSummary(summary) {

    const container =
        document.getElementById("stationNGSummary");

    Object.keys(summary)
    .forEach(group => {

        const item =
            document.createElement("div");

        item.className = "test-ng-item";

        item.innerHTML = `

            ${formatGroupName(group)}

            <b>
                NG: ${summary[group]}
            </b>

        `;

        container.appendChild(item);

    });

}


/* GET ALL GROUPS */

function getAllGroups(rows) {

    const groups = new Set();

    rows.forEach(row => {

        Object.keys(
            row._analysis.groups
        )
        .forEach(group =>
            groups.add(group)
        );

    });

    return [...groups];

}


/* STATION TEST TABS */

function renderStationTestTabs(
    groups,
    callback
) {

    const container =
        document.getElementById("stationTestTabs");

    container.innerHTML = "";

    if (
        activeTest !== "ALL"
        &&
        !groups.includes(activeTest)
    ) {

        activeTest = "ALL";

    }

    createTestButton(
        container,
        "ALL TESTS",
        "ALL",
        callback
    );

    groups.forEach(group => {

        createTestButton(
            container,
            formatGroupName(group),
            group,
            callback
        );

    });

}


/* STATION GRAPHS */

function renderStationGraphs(
    rows,
    allGroups
) {

    const container =
        document.getElementById("stationGraphs");

    container.innerHTML = "";

    let groupKeys = allGroups;

    if (activeTest !== "ALL") {

        groupKeys =
            groupKeys.filter(
                group => group === activeTest
            );

    }

    groupKeys.forEach((group, index) => {

        const card =
            document.createElement("div");

        card.className = "graph-card";

        if (activeTest !== "ALL") {

            card.classList.add("expanded");

        }

        card.innerHTML = `

            <div class="graph-title">

                ${formatGroupName(group)}
                — COMPILED STATION DATA

            </div>

            <div class="canvas-wrapper">

                <canvas
                    id="stationChart_${index}">
                </canvas>

            </div>

        `;

        container.appendChild(card);

        createStationChart(
            document.getElementById(
                `stationChart_${index}`
            ),
            rows,
            group
        );

    });

}


/* UNIT CHART
   NO NG DOTS */

function createUnitChart(
    canvas,
    items
) {

    const labels =
        items.map(item =>
            item.frequency !== 0
            ? item.frequency
            : formatSingleLabel(item.header)
        );

    const values =
        items.map(item => item.value);

    const upper =
        items.map(item => item.upper);

    const lower =
        items.map(item => item.lower);

    const chart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels,

                    datasets: [

                        {

                            label: "Measurement",

                            data: values,

                            borderColor: "#2563eb",

                            borderWidth: 2,

                            pointRadius: 0,

                            tension: 0.15,

                            spanGaps: true

                        },

                        {

                            label: "Upper Limit",

                            data: upper,

                            borderColor: "#dc2626",

                            borderWidth: 1.5,

                            pointRadius: 0,

                            tension: 0,

                            spanGaps: true

                        },

                        {

                            label: "Lower Limit",

                            data: lower,

                            borderColor: "#dc2626",

                            borderWidth: 1.5,

                            pointRadius: 0,

                            tension: 0,

                            spanGaps: true

                        }

                    ]

                },

                options:
                    chartOptions()

            }

        );

    charts.push(chart);

}


/* STATION COMPILED CHART
   NO NG DOTS */

function createStationChart(
    canvas,
    rows,
    group
) {

    const firstRow =
        rows.find(row =>
            row._analysis.groups[group]
        );

    if (!firstRow) return;

    const firstItems =
        firstRow._analysis.groups[group];

    const labels =
        firstItems.map(item =>
            item.frequency !== 0
            ? item.frequency
            : formatSingleLabel(item.header)
        );

    const datasets = [];


    /* ONE BLUE MEASUREMENT LINE
       FOR EACH DUT */

    rows.forEach((row, index) => {

        const items =
            row._analysis.groups[group];

        if (!items) return;

        datasets.push({

            label:
                `DUT ${index + 1}: ${row[0] || ""}`,

            data:
                items.map(
                    item => item.value
                ),

            borderColor:
                "rgba(37,99,235,0.18)",

            borderWidth: 1,

            pointRadius: 0,

            tension: 0.1,

            spanGaps: true

        });

    });


    /* UPPER LIMIT */

    datasets.push({

        label: "Upper Limit",

        data:
            firstItems.map(
                item => item.upper
            ),

        borderColor: "#dc2626",

        borderWidth: 2,

        pointRadius: 0,

        tension: 0,

        spanGaps: true

    });


    /* LOWER LIMIT */

    datasets.push({

        label: "Lower Limit",

        data:
            firstItems.map(
                item => item.lower
            ),

        borderColor: "#dc2626",

        borderWidth: 2,

        pointRadius: 0,

        tension: 0,

        spanGaps: true

    });


    const chart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels,

                    datasets

                },

                options:
                    chartOptions(true)

            }

        );

    charts.push(chart);

}


/* CHART OPTIONS */

function chartOptions(isStation = false) {

    return {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {

            mode: "index",

            intersect: false

        },

        plugins: {

            legend: {

                position: "top",

                labels: {

                    font: {
                        size: 9
                    },

                    boxWidth: 18,

                    filter: function(item) {

                        if (
                            isStation
                            &&
                            item.text.startsWith("DUT ")
                        ) {

                            return false;

                        }

                        return true;

                    }

                }

            },

            tooltip: {

                callbacks: {

                    label: function(context) {

                        if (
                            context.raw === null
                        ) {

                            return null;

                        }

                        return (
                            context.dataset.label
                            +
                            ": "
                            +
                            context.raw
                        );

                    }

                }

            }

        },

        scales: {

            x: {

                grid: {

                    color:
                        "rgba(148,163,184,.14)"

                },

                title: {

                    display: true,

                    text: "Frequency"

                },

                ticks: {

                    maxRotation: 45,

                    minRotation: 45,

                    autoSkip: true,

                    maxTicksLimit: 18,

                    font: {
                        size: 9
                    }

                }

            },

            y: {

                grid: {

                    color:
                        "rgba(148,163,184,.20)"

                },

                title: {

                    display: true,

                    text: "Measurement"

                },

                ticks: {

                    font: {
                        size: 9
                    }

                }

            }

        }

    };

}


/* DESTROY CHARTS */

function destroyCharts() {

    charts.forEach(chart => {

        chart.destroy();

    });

    charts = [];

}


/* FORMAT */

function formatGroupName(name) {

    return name
        .replace(/^F_MB_/, "")
        .replace(/_/g, " ");

}


function formatSingleLabel(header) {

    return header
        .replace(/^F_MB_/, "");

}


/* NUMBER */

function toNumber(value) {

    if (
        value === undefined
        ||
        value === null
    ) {

        return null;

    }

    const text =
        String(value)
        .trim();

    if (
        text === ""
        ||
        text === "-"
        ||
        text.toLowerCase() === "nan"
    ) {

        return null;

    }

    const number =
        Number(
            text.replace(/,/g, "")
        );

    return Number.isNaN(number)
        ? null
        : number;

}


/* ESCAPE HTML */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
