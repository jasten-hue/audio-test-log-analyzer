<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUDIO TEST LOG ANALYZER</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --blue: #2563eb;
    --red: #dc2626;
    --green: #16a34a;
    --bg: #f3f6fa;
    --card: #ffffff;
    --border: #dfe5ec;
    --text: #1f2937;
    --muted: #64748b;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    height: 68px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
}

.header-title h1 {
    margin: 0;
    font-size: 21px;
}

.header-title p {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--muted);
}

.upload-button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
}

#fileInput {
    display: none;
}

.back-upload-button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 8px;
}

.back-upload-button:hover {
    background: #f1f5f9;
}

#startScreen {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.upload-card {
    width: 520px;
    max-width: 100%;
    background: white;
    border: 2px dashed #b9c4d0;
    border-radius: 14px;
    padding: 40px 30px 55px;
    text-align: center;
    transition: .2s;
}

.upload-card.dragover {
    border-color: var(--blue);
    background: #eff6ff;
}

.upload-card h2 {
    margin: 0 0 10px;
}

.upload-card p {
    color: var(--muted);
    font-size: 14px;
}

.model-section {
    margin: 24px 0 18px;
    text-align: left;
}

.model-label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    color: var(--muted);
    margin-bottom: 7px;
}

.model-select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: white;
    font-weight: bold;
    font-size: 13px;
    outline: none;
}

.upload-main-button {
    margin-top: 15px;
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    background: var(--blue);
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.drop-text {
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
}

/* APP */

#app {
    display: none;
    height: calc(100vh - 68px);
}

.app-layout {
    display: grid;
    grid-template-columns: 440px 1fr;
    height: 100%;
}

/* SIDEBAR */

.sidebar {
    background: white;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 15px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.sidebar-title {
    font-size: 15px;
    font-weight: bold;
}

.total-count {
    font-size: 11px;
    color: var(--muted);
}

.filter-label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-size: 9px;
    font-weight: bold;
    color: var(--muted);
}

.station-select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
}

.status-filters {
    display: flex;
    gap: 6px;
}

.status-filter {
    flex: 1;
    border: 1px solid var(--border);
    background: #f8fafc;
    padding: 8px 5px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.status-filter.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

.search-box textarea {
    width: 100%;
    min-height: 75px;
    resize: vertical;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
}

/* SN TABLE */

.sn-table-header,
.sn-row {
    display: grid;
    grid-template-columns: 28px 1.2fr 1fr 62px 1.2fr 18px;
    gap: 4px;
    align-items: center;
}

.sn-table-header {
    padding: 10px 8px;
    font-size: 8px;
    color: var(--muted);
    font-weight: bold;
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
}

.sn-list {
    flex: 1;
    overflow-y: auto;
}

.sn-row {
    min-height: 58px;
    padding: 7px 8px;
    border-bottom: 1px solid #edf0f3;
    font-size: 9px;
    cursor: pointer;
}

.sn-row:hover {
    background: #f8fafc;
}

.sn-row.selected {
    background: #eaf2ff;
    box-shadow: inset 3px 0 0 var(--blue);
}

.sn-number {
    color: var(--muted);
}

.sn-pcba {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sn-station {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #475569;
}

.status-badge {
    display: inline-block;
    padding: 5px 6px;
    border-radius: 4px;
    font-size: 8px;
    font-weight: bold;
    color: white;
}

.status-pass {
    background: var(--green);
}

.status-ng {
    background: var(--red);
}

.ng-details {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #475569;
}

.arrow {
    color: var(--blue);
    font-size: 16px;
}

/* MAIN */

.content {
    overflow-y: auto;
    padding: 14px 18px 25px;
}

.view-mode-section {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
}

.view-mode-button {
    border: 1px solid var(--border);
    background: white;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.view-mode-button.active {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
}

/* INFO BAR */

.info-bar {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    align-items: stretch;
    margin-bottom: 12px;
    overflow: hidden;
    flex-wrap: wrap;
}

.info-item {
    padding: 15px 18px;
    min-width: 145px;
    border-right: 1px solid #e9edf2;
}

.info-label {
    font-size: 9px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 7px;
}

.info-value {
    font-size: 13px;
    font-weight: bold;
}

.result-pass {
    color: var(--green);
}

.result-ng {
    color: var(--red);
}

.ng-summary {
    flex: 1;
    padding: 14px 18px;
}

.ng-summary-title {
    font-size: 9px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 8px;
}

.ng-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.ng-pill {
    background: #f8fafc;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 9px;
}

.ng-pill span {
    color: var(--red);
    font-weight: bold;
    margin-left: 4px;
}

/* STATION SUMMARY */

.station-summary {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 16px;
    margin-bottom: 12px;
}

.station-summary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.station-summary-title {
    font-size: 14px;
    font-weight: bold;
}

.station-summary-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
}

.summary-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.summary-stat {
    min-width: 100px;
    background: #f8fafc;
    border-radius: 6px;
    padding: 11px;
}

.summary-stat-label {
    font-size: 8px;
    color: var(--muted);
    font-weight: bold;
}

.summary-stat-value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.summary-good {
    color: var(--green);
}

.summary-ng {
    color: var(--red);
}

.test-ng-summary {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.test-ng-item {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 10px;
    background: white;
}

.test-ng-item b {
    color: var(--red);
    margin-left: 5px;
}

/* TEST FILTER */

.test-filter-section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 12px;
}

.test-filter-title {
    font-size: 10px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 9px;
}

.test-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.test-tab {
    border: 1px solid var(--border);
    background: #f1f5f9;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.test-tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

/* GRAPHS */

.graphs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.graph-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    min-height: 350px;
}

.graph-card.expanded {
    grid-column: 1 / -1;
    min-height: calc(100vh - 310px);
}

.graph-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.graph-title {
    font-size: 13px;
    font-weight: bold;
}

.graph-controls {
    display: flex;
    gap: 5px;
    align-items: center;
}

.graph-zoom-btn,
.graph-reset-btn {
    border: 1px solid var(--border);
    background: white;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    height: 28px;
}

.graph-zoom-btn {
    width: 30px;
    font-size: 16px;
}

.graph-reset-btn {
    padding: 0 10px;
    font-size: 10px;
}

.graph-zoom-btn:hover,
.graph-reset-btn:hover {
    background: #f1f5f9;
}

.canvas-wrapper {
    height: 290px;
    position: relative;
}

.graph-card.expanded .canvas-wrapper {
    height: calc(100vh - 390px);
    min-height: 450px;
}

.no-graph {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 70px;
    text-align: center;
    color: var(--muted);
}

@media (max-width: 1150px) {
    .app-layout {
        grid-template-columns: 390px 1fr;
    }
}

@media (max-width: 850px) {

    #app {
        height: auto;
    }

    .app-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        height: 600px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    .graphs {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

</div>

</div>

<div id="app">

<div class="app-layout">

<aside class="sidebar">

        <div class="total-count" id="totalCount">

    </div>

    <label class="filter-label">

    <label class="filter-label">
        STATUS

    <div class="status-filters">

            ALL

            GOOD
        </button>

        <button class="status-filter" data-status="NG">
            NG
        </button>

    </div>

    <label class="filter-label">
        SEARCH SN / PCBA
    </label>

    <div class="search-box">

        <textarea
            id="searchInput"
            placeholder="Paste one or multiple SN here...

Comma, space, semicolon or new line supported"></textarea>

    </div>

</div>

<div class="sn-table-header">

    <div>#</div>

    <div>STATION IP</div>

</div>

<div class="sn-list" id="snList"></div>

</aside>

<main class="content">

<div class="view-mode-section">

<button class="view-mode-button active" data-view="UNIT">
    UNIT VIEW
</button>

<button class="view-mode-button" data-view="STATION">
    STATION SUMMARY
</button>

</div>

<div id="unitView"></div>

<div id="stationView" style="display:none;"></div>

</main>

</div>

   AUDIO GRAPH / TEST FILTER

   Only these six real audio measurements are allowed.
   Any NO_DATA measurement is ignored completely.
========================================================= */

const ALLOWED_AUDIO_GROUPS = [
    "F_MB_MIC_FR",
    "F_MB_MIC_SEAL",
    "F_MB_MIC_THD",
    "F_MB_SPK_FR",
    "F_MB_SPK_RB",
    "F_MB_SPK_THD"
];

const ALLOWED_AUDIO_GROUP_SET = new Set(ALLOWED_AUDIO_GROUPS);

function isAllowedAudioGroup(group) {

    const normalized = String(group || "")
        .trim()
        .toUpperCase();

    // Never allow NO_DATA groups.
    if (normalized.includes("NO_DATA")) {
        return false;
    }

    return ALLOWED_AUDIO_GROUP_SET.has(normalized);
}

function getAllowedAudioGroups(groups) {

    return Object.keys(groups || {})
        .filter(isAllowedAudioGroup);
}

/* =========================================================

========================================================= */

function initializeModelSpecs() {

    ["2RS4", "XUA4"].forEach(model => {

        const lines =
            MODEL_SPECS[model]
            .trim()
            .split("\n");

        const spec = {};

        lines.slice(1).forEach(line => {

            const parts =
                line
                .trim()
                .split(",");

            const hz =
                Number(parts[0]);

            spec[hz] = {

                spkFRLL: toNumber(parts[1]),
                spkFRUL: toNumber(parts[2]),
                spkRBUL: toNumber(parts[3]),
                spkTHDUL: toNumber(parts[4]),
                micFRLL: toNumber(parts[5]),
                micFRUL: toNumber(parts[6]),
                micSealLL: toNumber(parts[7]),
                micSealUL: toNumber(parts[8]),
                micTHDUL: toNumber(parts[9])

            };

        });

        parsedModelSpecs[model] = spec;

    });

}

function loadCSVFile(file) {

    selectedModel =
        document
        .getElementById("modelSelect")
        .value;

    if (!selectedModel) {

        alert(
            "Please select a product model first."
        );

        return;

    }

    Papa.parse(file, {

        header: false,

        skipEmptyLines: true,

        complete: function(results) {

            csvData =
                results.data;

            processCSV();

        }

    });

}


/* =========================================================
   PROCESS CSV
========================================================= */

function processCSV() {

    if (csvData.length < 3) {

        alert("Invalid CSV.");

        return;

    }

    headers =
        csvData[0];

    lowerRow =
        findRow("Lower");

    upperRow =
        findRow("Upper");

    stationColumn =
        headers.findIndex(
            header =>
                String(header || "")
                .trim()
                .toLowerCase()
                === "stationip"
        );

    if (stationColumn === -1) {

        alert(
            "StationIP column was not found."
        );

        return;

    }

    dutRows =
        csvData
        .slice(1)
        .filter(row => {

            const first =
                String(row[0] || "")
                .trim()
                .toLowerCase();

            if (!first) return false;

            const excluded = [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cpk"
            ];

            return !excluded.includes(first);

        });

    dutRows.forEach(row => {

        row._analysis =
            analyzeDUT(row);

    });

    populateStationFilter();

    applyFilters();

    document
    .getElementById("startScreen")
    .style.display = "none";

    document
    .getElementById("app")
    .style.display = "block";

    if (dutRows.length > 0) {

        selectDUT(0);

    }

}


/* =========================================================
   FIND LOWER / UPPER ROW
========================================================= */

function findRow(name) {

    return csvData.find(
        row =>
            String(row[0] || "")
            .trim()
            .toLowerCase()
            === name.toLowerCase()
    );

}


/* =========================================================
   ANALYZE DUT
========================================================= */

function analyzeDUT(row) {

    const groups =
        detectMeasurementGroups(row);

    const summary = {};

    let totalNG = 0;

    Object.keys(groups)
    .forEach(group => {

        let ngCount = 0;

        groups[group]
        .forEach(item => {

            if (isNG(item)) {

                ngCount++;
                totalNG++;

            }

        });

        summary[group] = {

            ngCount,

            status:
                ngCount > 0
                ? "NG"
                : "PASS"

        };

    });

    const failedTests =
        Object.keys(summary)
        .filter(
            group =>
                summary[group].ngCount > 0
        );

    return {

        groups,
        summary,
        totalNG,
        failedTests,

        result:
            totalNG > 0
            ? "NG"
            : "PASS"

    };

}


/* =========================================================
   DETECT MEASUREMENT GROUPS
========================================================= */

function detectMeasurementGroups(row) {

    const groups = {};

    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(headers[i] || "")
            .trim();

        if (!header) continue;

        const upperHeader =
            header.toUpperCase();

        if (
            !upperHeader.includes("MIC")
            &&
            !upperHeader.includes("SPK")
        ) {
            continue;
        }

        const info =
            parseMeasurementHeader(
                upperHeader
            );

        if (!info) continue;

        // Filter BEFORE creating the group.
        // This prevents unwanted tests and NO_DATA from appearing
        // anywhere in Unit View or Station Summary.
        if (!isAllowedAudioGroup(info.group)) {
            continue;
        }

        let value =
            toNumber(row[i]);

        let lower =
            toNumber(
                lowerRow?.[i]
            );

        let upper =
            toNumber(
                upperRow?.[i]
            );

        const modelLimits =
            getModelLimits(
                info.group,
                info.frequency
            );

        if (
            modelLimits.lower !== null
        ) {

            lower =
                modelLimits.lower;

        }

        if (
            modelLimits.upper !== null
        ) {

            upper =
                modelLimits.upper;

        }

        if (
            selectedModel === "BLA4"
            &&
            (
                info.group.includes("SPK_FR")
                ||
                info.group.includes("MIC_FR")
            )
        ) {

            lower =
                toNumber(
                    lowerRow?.[i]
                );

            upper =
                toNumber(
                    upperRow?.[i]
                );

        }

        if (
            value === null
            &&
            lower === null
            &&
            upper === null
        ) {
            continue;
        }

        if (!groups[info.group]) {

            groups[info.group] = [];

        }

        groups[info.group]
        .push({

            column: i,

            header,

            frequency:
                info.frequency,

            value,

            lower,

            upper

        });

    }

    Object.values(groups)
    .forEach(items => {

        items.sort(
            (a, b) =>
                a.frequency
                - b.frequency
        );

    });

    return groups;

}


/* =========================================================
   GET MODEL LIMITS
========================================================= */

function getModelLimits(
    group,
    frequency
) {

    let lower = null;
    let upper = null;

    if (
        selectedModel === "2RS4"
        ||
        selectedModel === "XUA4"
    ) {

        const spec =
            parsedModelSpecs[
                selectedModel
            ]?.[frequency];

        if (!spec) {

            return {
                lower,
                upper
            };

        }

        if (
            group.includes("SPK_FR")
        ) {

            lower =
                spec.spkFRLL;

            upper =
                spec.spkFRUL;

        }

        else if (
            group.includes("SPK_RB")
        ) {

            upper =
                spec.spkRBUL;

        }

        else if (
            group.includes("SPK_THD")
        ) {

            upper =
                spec.spkTHDUL;

        }

        else if (
            group.includes("MIC_FR")
        ) {

            lower =
                spec.micFRLL;

            upper =
                spec.micFRUL;

        }

        else if (
            group.includes("MIC_SEAL")
        ) {

            lower =
                spec.micSealLL;

            upper =
                spec.micSealUL;

        }

        else if (
            group.includes("MIC_THD")
        ) {

            upper =
                spec.micTHDUL;

        }

    }

    if (
        selectedModel === "BLA4"
    ) {

        if (
            group.includes("SPK_THD")
        ) {

            upper =
                frequency <= 400
                ? 40
                : 10;

        }

        else if (
            group.includes("SPK_RB")
        ) {

            upper =
                frequency <= 300
                ? 1.2
                : 0.7;

        }

        else if (
            group.includes("MIC_THD")
        ) {

            if (
                frequency >= 100
                &&
                frequency <= 2500
            ) {

                upper = 1;

            }

            else if (
                frequency > 2500
                &&
                frequency <= 6300
            ) {

                upper = 1.5;

            }

            else if (
                frequency > 6300
                &&
                frequency <= 8000
            ) {

                upper = 1;

            }

        }

        else if (
            group.includes("MIC_SEAL")
        ) {

            if (
                frequency >= 200
            ) {

                lower = 25;

            }

            if (
                frequency >= 100
                &&
                frequency <= 10000
            ) {

                upper = 100;

            }

        }

    }

    return {
        lower,
        upper
    };

}


/* =========================================================
   PARSE HEADER
========================================================= */

function parseMeasurementHeader(header) {

    const match =
        header.match(
            /_(\d+(?:\.\d+)?)$/
        );

    let group =
        header;

    let frequency = 0;

    if (match) {

        frequency =
            Number(match[1]);

        group =
            header.replace(
                /_(\d+(?:\.\d+)?)$/,
                ""
            );

    }

    return {
        group,
        frequency
    };

}


/* =========================================================
   CHECK NG
========================================================= */

function isNG(item) {

    if (
        item.value === null
    ) {

        return false;

    }

    if (
        item.lower !== null
        &&
        item.value < item.lower
    ) {

        return true;

    }

    if (
        item.upper !== null
        &&
        item.value > item.upper
    ) {

        return true;

    }

    return false;

}


/* =========================================================
   CHECK MEASUREMENT DATA

   IMPORTANT:
   A graph/test will only be displayed if there is
   at least one REAL DUT measurement value.

   UL and LL alone will NOT create a graph.
========================================================= */

function hasMeasurementData(items) {

    if (
        !Array.isArray(items)
        ||
        items.length === 0
    ) {

        return false;

    }

    return items.some(item => {

        if (
            item.value === null
            ||
            item.value === undefined
            ||
            item.value === ""
        ) {

            return false;

        }

        return Number.isFinite(
            Number(item.value)
        );

    });

}


function getGroupsWithData(groups) {

    return Object.keys(groups)
    .filter(group => {

        return hasMeasurementData(
            groups[group]
        );

    });

}

/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters() {

    const searchText =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();

    const searchTerms =
        searchText
        ? searchText
            .split(/[\s,;]+/)
            .filter(Boolean)
        : [];

    filteredRows =
        dutRows.filter(row => {

            const analysis =
                row._analysis;

            const station =
                String(
                    row[stationColumn]
                    || ""
                ).trim();

            const sn =
                String(
                    row[0] || ""
                )
                .toLowerCase();

            const work =
                String(
                    row[1] || ""
                )
                .toLowerCase();

            if (
                activeStation !== "ALL"
                &&
                station !== activeStation
            ) {

                return false;

            }

            if (
                activeStatus !== "ALL"
                &&
                analysis.result
                !== activeStatus
            ) {

                return false;

            }

            if (
                searchTerms.length > 0
            ) {

                const found =
                    searchTerms.some(
                        term =>
                            sn.includes(term)
                            ||
                            work.includes(term)
                    );

                if (!found) {

                    return false;

                }

            }

            return true;

        });

    renderSidebar();

    if (
        filteredRows.length > 0
    ) {

        const selected =
            dutRows[
                selectedDutIndex
            ];

        if (
            !filteredRows.includes(
                selected
            )
        ) {

            selectedDutIndex =
                dutRows.indexOf(
                    filteredRows[0]
                );

        }

        if (
            activeView === "UNIT"
        ) {

            renderUnitView();

        }

    }

    else {

        if (
            activeView === "UNIT"
        ) {

            document
            .getElementById(
                "unitView"
            )
            .innerHTML = `
                <div class="no-graph">
                    No units found.
                </div>
            `;

        }

    }

    if (
        activeView === "STATION"
    ) {

        renderStationView();

    }

}

            <div class="ng-details">

                ${
                    failedNames
                    ? escapeHTML(
                        failedNames
                    )
                    : "-"
                }

            </div>

            <div class="arrow">
                ›
            </div>

        `;

        item.onclick =
            function() {

                selectDUT(
                    actualIndex
                );

            };

        list.appendChild(item);

    });

}


/* =========================================================
   SELECT DUT
========================================================= */

function selectDUT(index) {

    selectedDutIndex =
        index;

    if (
        activeView === "UNIT"
    ) {

        renderUnitView();

    }

    renderSidebar();

}


/* =========================================================
   VIEW MODE
========================================================= */

document
.querySelectorAll(
    ".view-mode-button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            activeView =
                this.dataset.view;

            activeTest =
                "ALL";

            document
            .querySelectorAll(
                ".view-mode-button"
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            this.classList.add(
                "active"
            );

            if (
                activeView === "UNIT"
            ) {

                document
                .getElementById(
                    "unitView"
                )
                .style.display =
                    "block";

                document
                .getElementById(
                    "stationView"
                )
                .style.display =
                    "none";

                renderUnitView();

            }

            else {

                document
                .getElementById(
                    "unitView"
                )
                .style.display =
                    "none";

                document
                .getElementById(
                    "stationView"
                )
                .style.display =
                    "block";

                renderStationView();

            }

        }
    );

});


/* =========================================================
   UNIT VIEW
========================================================= */

function renderUnitView() {

    destroyCharts();

    const container =
        document.getElementById(
            "unitView"
        );

    const row =
        dutRows[
            selectedDutIndex
        ];

    if (!row) {

        container.innerHTML = `
            <div class="no-graph">
                No DUT selected.
            </div>
        `;

        return;

    }

    const analysis =
        row._analysis;

    container.innerHTML = `

        <div class="info-bar">

            <div class="info-item">

                <div class="info-label">
                    PRODUCT
                </div>

                <div class="info-value">
                    ${escapeHTML(selectedModel)}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    PCBA / SN
                </div>

                <div class="info-value">
                    ${escapeHTML(
                        row[0] || "-"
                    )}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    STATION IP
                </div>

                <div class="info-value">
                    ${escapeHTML(
                        row[stationColumn]
                        || "-"
                    )}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    OVERALL RESULT
                </div>

                <div class="
                    info-value
                    ${
                        analysis.result === "PASS"
                        ? "result-pass"
                        : "result-ng"
                    }
                ">

                    ${
                        analysis.result === "PASS"
                        ? "GOOD"
                        : `NG (${analysis.totalNG})`
                    }

                </div>

            </div>

            <div class="ng-summary">

                <div class="ng-summary-title">
                    NG SUMMARY
                </div>

                <div
                    class="ng-pills"
                    id="unitNGSummary">
                </div>

            </div>

        </div>

        <div class="test-filter-section">

            <div class="test-filter-title">
                SELECT TEST TO DISPLAY
            </div>

            <div
                class="test-tabs"
                id="unitTestTabs">
            </div>

        </div>

        <div
            class="graphs"
            id="unitGraphs">
        </div>

    `;

    renderUnitNGSummary(
        analysis
    );

    renderTestTabs(
        "unitTestTabs",
        analysis.groups,
        function() {

            renderUnitView();

        }
    );

    renderUnitGraphs(
        analysis.groups
    );

}


function renderUnitNGSummary(
    analysis
) {

    const container =
        document.getElementById(
            "unitNGSummary"
        );

    const groups =
        getGroupsWithData(
            analysis.groups
        );

    if (
        groups.length === 0
    ) {

        container.innerHTML =
            "No measurement data.";

        return;

    }

    groups.forEach(group => {

        const data =
            analysis.summary[group];

        const pill =
            document.createElement(
                "div"
            );

        pill.className =
            "ng-pill";

        pill.innerHTML = `

            ${formatGroupName(group)}

            <span>
                ${data.ngCount}
            </span>

        `;

        container.appendChild(
            pill
        );

    });

}


/* =========================================================
   TEST TABS
========================================================= */

function renderTestTabs(
    containerID,
    groups,
    callback
) {

    const container =
        document.getElementById(
            containerID
        );

    container.innerHTML = "";

    // Always show all six requested test tabs.
    // A test with no data will show a "No measurement data" graph card.
    let groupKeys =
        [...ALLOWED_AUDIO_GROUPS];

    if (
        activeTest !== "ALL"
        &&
        !groupKeys.includes(
            activeTest
        )
    ) {

        activeTest = "ALL";

    }

    createTestButton(
        container,
        "ALL TESTS",
        "ALL",
        callback
    );

    groupKeys.forEach(group => {

        createTestButton(
            container,
            formatGroupName(group),
            group,
            callback
        );

    });

}


function createTestButton(
    container,
    label,
    test,
    callback
) {

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "test-tab";

    if (
        activeTest === test
    ) {

        button.classList.add(
            "active"
        );

    }

    button.textContent =
        label;

    button.onclick =
        function() {

            activeTest =
                test;

            callback();

        };

    container.appendChild(
        button
    );

}


/* =========================================================
   UNIT GRAPHS
========================================================= */

function renderUnitGraphs(
    groups
) {

    const container =
        document.getElementById(
            "unitGraphs"
        );

    container.innerHTML = "";

    // Always render all six requested graph cards.
    // Missing data is handled inside the card instead of hiding the graph.
    let groupKeys =
        [...ALLOWED_AUDIO_GROUPS];

    if (
        activeTest !== "ALL"
    ) {

        groupKeys =
            groupKeys.filter(
                group =>
                    group === activeTest
            );

    }

    if (
        groupKeys.length === 0
    ) {

        container.innerHTML = `
            <div class="no-graph">
                No measurement data available.
            </div>
        `;

        return;

    }

    groupKeys.forEach(
        (group, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "graph-card";

            if (
                activeTest !== "ALL"
            ) {

                card.classList.add(
                    "expanded"
                );

            }

            card.innerHTML = `

                <div class="graph-header">

                    <div class="graph-title">
                        ${formatGroupName(group)}
                    </div>

                    <div class="graph-controls">

                        <button
                            class="graph-zoom-btn"
                            onclick="zoomGraph('unitChart_${index}',1.2)">

                            +

                        </button>

                        <button
                            class="graph-zoom-btn"
                            onclick="zoomGraph('unitChart_${index}',0.8)">

                            −

                        </button>

                        <button
                            class="graph-reset-btn"
                            onclick="resetGraph('unitChart_${index}')">

                            Reset

                        </button>

                    </div>

                </div>

                <div class="canvas-wrapper">

                    <canvas
                        id="unitChart_${index}">
                    </canvas>

                </div>

            `;

            container.appendChild(card);

            const unitItems = groups[group] || [];
            const unitCanvas = document.getElementById(`unitChart_${index}`);

            if (hasMeasurementData(unitItems)) {
                createUnitChart(unitCanvas, unitItems);
            } else {
                unitCanvas.parentElement.innerHTML = `
                    <div class="no-graph" style="padding:70px 20px;">
                        No measurement data for this unit.
                    </div>
                `;
            }

        }
    );

}


/* =========================================================
   STATION VIEW
========================================================= */

function renderStationView() {

    destroyCharts();

    const container =
        document.getElementById(
            "stationView"
        );

    const rows =
        filteredRows;

    if (
        rows.length === 0
    ) {

        container.innerHTML = `
            <div class="no-graph">
                No units available for the selected filters.
            </div>
        `;

        return;

    }

    const stationName =
        activeStation === "ALL"
        ? "ALL STATIONS"
        : activeStation;

    const total =
        rows.length;

    const good =
        rows.filter(
            row =>
                row._analysis.result
                === "PASS"
        ).length;

    const ng =
        total - good;

    const groupSummary =
        calculateGroupSummary(rows);

    // Keep all six graph types available even when a filtered GOOD unit
    // has no measurement values for one of the speaker tests.
    const allGroups =
        [...ALLOWED_AUDIO_GROUPS];

    if (
        activeTest !== "ALL"
        &&
        !allGroups.includes(activeTest)
    ) {

        activeTest = "ALL";

    }

    container.innerHTML = `

        <div class="station-summary">

            <div class="station-summary-header">

                <div>

                    <div class="station-summary-title">

                        STATION SUMMARY:
                        ${escapeHTML(stationName)}

                    </div>

                    <div class="station-summary-subtitle">

                        Product:
                        ${escapeHTML(selectedModel)}
                        • Compiled from
                        ${total}
                        filtered unit(s)

                    </div>

                </div>

            </div>

            <div class="summary-stats">

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        TOTAL UNITS
                    </div>

                    <div class="summary-stat-value">
                        ${total}
                    </div>

                </div>

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        GOOD
                    </div>

                    <div class="
                        summary-stat-value
                        summary-good">

                        ${good}

                    </div>

                </div>

                <div class="summary-stat">

                    <div class="summary-stat-label">
                        NG
                    </div>

                    <div class="
                        summary-stat-value
                        summary-ng">

                        ${ng}

                    </div>

                </div>

            </div>

            <div
                class="test-ng-summary"
                id="stationNGSummary">
            </div>

        </div>

        <div class="test-filter-section">

            <div class="test-filter-title">
                SELECT COMPILED TEST GRAPH
            </div>

            <div
                class="test-tabs"
                id="stationTestTabs">
            </div>

        </div>

        <div
            class="graphs"
            id="stationGraphs">
        </div>

    `;

    renderStationNGSummary(
        groupSummary,
        allGroups
    );

    renderStationTestTabs(
        allGroups,
        function() {

            renderStationView();

        }
    );

    renderStationGraphs(
        rows,
        allGroups
    );

}


/* =========================================================
   GROUP SUMMARY
========================================================= */

function calculateGroupSummary(rows) {

    const summary = {};

    rows.forEach(row => {

        Object.keys(
            row._analysis.summary
        )
        .forEach(group => {

            if (
                !hasMeasurementData(
                    row._analysis.groups[group]
                )
            ) {

                return;

            }

            if (!summary[group]) {

                summary[group] = 0;

            }

            summary[group] +=
                row
                ._analysis
                .summary[group]
                .ngCount;

        });

    });

    return summary;

}


function renderStationNGSummary(
    summary,
    groupsWithData
) {

    const container =
        document.getElementById(
            "stationNGSummary"
        );

    container.innerHTML = "";

    groupsWithData.forEach(group => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "test-ng-item";

        item.innerHTML = `

            ${formatGroupName(group)}

            <b>
                NG: ${summary[group] || 0}
            </b>

        `;

        container.appendChild(item);

    });

}


function getAllGroupsWithData(rows) {

    const groups =
        new Set();

    rows.forEach(row => {

        Object.keys(
            row._analysis.groups
        )
        .forEach(group => {

            if (
                hasMeasurementData(
                    row._analysis.groups[group]
                )
            ) {

                groups.add(group);

            }

        });

    });

    return [...groups];

}


function renderStationTestTabs(
    groups,
    callback
) {

    const container =
        document.getElementById(
            "stationTestTabs"
        );

    container.innerHTML = "";

    createTestButton(
        container,
        "ALL TESTS",
        "ALL",
        callback
    );

    ALLOWED_AUDIO_GROUPS.forEach(group => {

        createTestButton(
            container,
            formatGroupName(group),
            group,
            callback
        );

    });

}


/* =========================================================
   STATION GRAPHS
========================================================= */

function renderStationGraphs(
    rows,
    allGroups
) {

    const container =
        document.getElementById(
            "stationGraphs"
        );

    container.innerHTML = "";

    // Always render all six requested graph cards.
    let groupKeys =
        [...ALLOWED_AUDIO_GROUPS];

    if (
        activeTest !== "ALL"
    ) {

        groupKeys =
            groupKeys.filter(
                group =>
                    group === activeTest
            );

    }


    groupKeys.forEach(
        (group, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "graph-card";

            if (
                activeTest !== "ALL"
            ) {

                card.classList.add(
                    "expanded"
                );

            }

            card.innerHTML = `

                <div class="graph-header">

                    <div class="graph-title">

                        ${formatGroupName(group)}

                        — COMPILED STATION DATA

                    </div>

                    <div class="graph-controls">

                        <button
                            class="graph-zoom-btn"
                            onclick="zoomGraph('stationChart_${index}',1.2)">

                            +

                        </button>

                        <button
                            class="graph-zoom-btn"
                            onclick="zoomGraph('stationChart_${index}',0.8)">

                            −

                        </button>

                        <button
                            class="graph-reset-btn"
                            onclick="resetGraph('stationChart_${index}')">

                            Reset

                        </button>

                    </div>

                </div>

                <div class="canvas-wrapper">

                    <canvas
                        id="stationChart_${index}">
                    </canvas>

                </div>

            `;

            container.appendChild(card);

            const stationCanvas = document.getElementById(`stationChart_${index}`);
            const stationHasData = rows.some(row =>
                hasMeasurementData(row._analysis.groups[group])
            );

            if (stationHasData) {
                createStationChart(stationCanvas, rows, group);
            } else {
                stationCanvas.parentElement.innerHTML = `
                    <div class="no-graph" style="padding:70px 20px;">
                        No measurement data in the selected GOOD units.
                    </div>
                `;
            }

        }
    );

}


/* =========================================================
   CREATE UNIT CHART
========================================================= */

function createUnitChart(
    canvas,
    items
) {

    /* Do not create graph if there is no actual measurement */

    if (
        !hasMeasurementData(items)
    ) {

        return;

    }

    const labels =
        items.map(
            item =>
                item.frequency !== 0
                ? item.frequency
                : formatSingleLabel(
                    item.header
                )
        );

    const values =
        items.map(
            item =>
                item.value
        );

    const upper =
        items.map(
            item =>
                item.upper
        );

    const lower =
        items.map(
            item =>
                item.lower
        );

    const chart =
        new Chart(canvas, {

            type: "line",

            data: {

                labels,

                datasets: [

                    {

                        label: "Measurement",

                        data: values,

                        borderColor: "#2563eb",

                        borderWidth: 2,

                        pointRadius: 0,

                        pointHoverRadius: 3,

                        tension: 0.15,

                        spanGaps: true

                    },

                    {

                        label: "Upper Limit",

                        data: upper,

                        borderColor: "#dc2626",

                        borderWidth: 1.5,

                        pointRadius: 0,

                        pointHoverRadius: 0,

                        tension: 0,

                        spanGaps: true

                    },

                    {

                        label: "Lower Limit",

                        data: lower,

                        borderColor: "#dc2626",

                        borderWidth: 1.5,

                        pointRadius: 0,

                        pointHoverRadius: 0,

                        tension: 0,

                        spanGaps: true

                    }

                ]

            },

            options:
                chartOptions(false)

        });

    charts.push(chart);

}


/* =========================================================
   CREATE STATION CHART
========================================================= */

function createStationChart(
    canvas,
    rows,
    group
) {

    const firstRow =
        rows.find(row => {

            const items =
                row
                ._analysis
                .groups[group];

            return hasMeasurementData(
                items
            );

        });

    if (!firstRow) return;

    const firstItems =
        firstRow
        ._analysis
        .groups[group];

    const labels =
        firstItems.map(
            item =>
                item.frequency !== 0
                ? item.frequency
                : formatSingleLabel(
                    item.header
                )
        );

    const datasets = [];

    rows.forEach(
        (row, index) => {

            const items =
                row
                ._analysis
                .groups[group];

            if (
                !hasMeasurementData(items)
            ) {

                return;

            }

            datasets.push({

                label:
                    `DUT ${index + 1}`,

                data:
                    items.map(
                        item =>
                            item.value
                    ),

                borderColor:
                    "rgba(37,99,235,0.18)",

                borderWidth: 1,

                pointRadius: 0,

                pointHoverRadius: 0,

                tension: 0.1,

                spanGaps: true

            });

        }
    );

    datasets.push({

        label: "Upper Limit",

        data:
            firstItems.map(
                item =>
                    item.upper
            ),

        borderColor: "#dc2626",

        borderWidth: 2,

        pointRadius: 0,

        pointHoverRadius: 0,

        tension: 0,

        spanGaps: true

    });

    datasets.push({

        label: "Lower Limit",

        data:
            firstItems.map(
                item =>
                    item.lower
            ),

        borderColor: "#dc2626",

        borderWidth: 2,

        pointRadius: 0,

        pointHoverRadius: 0,

        tension: 0,

        spanGaps: true

    });

    const chart =
        new Chart(canvas, {

            type: "line",

            data: {
                labels,
                datasets
            },

            options:
                chartOptions(true)

        });

    charts.push(chart);

}


/* =========================================================
   CHART OPTIONS
========================================================= */

function chartOptions(
    isStation = false
) {

    return {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {

            mode: "nearest",

            intersect: false,

            axis: "y"

        },

        plugins: {

            legend: {

                position: "top",

                labels: {

                    font: {
                        size: 9
                    },

                    boxWidth: 18,

                    filter:
                        function(item) {

                            if (
                                isStation
                                &&
                                item.text.startsWith(
                                    "DUT "
                                )
                            ) {

                                return false;

                            }

                            return true;

                        }

                }

            },

            tooltip: {

                enabled: true,

                filter:
                    function(context) {

                        if (
                            isStation
                            &&
                            context.dataset.label
                            .startsWith(
                                "DUT "
                            )
                        ) {

                            return false;

                        }

                        return true;

                    },

                callbacks: {

                    label:
                        function(context) {

                            if (
                                context.raw === null
                            ) {

                                return null;

                            }

                            return (
                                context.dataset.label
                                +
                                ": "
                                +
                                context.raw
                            );

                        }

                }

            },

            zoom: {

                pan: {

                    enabled: true,

                    mode: "y",

                    modifierKey: "shift"

                },

                zoom: {

                    wheel: {
                        enabled: true
                    },

                    pinch: {
                        enabled: true
                    },

                    mode: "y"

                },

                limits: {

                    x: {

                        min: "original",

                        max: "original"

                    }

                }

            }

        },

        scales: {

            x: {

                grid: {

                    color:
                        "rgba(148,163,184,.14)"

                },

                title: {

                    display: true,

                    text: "Frequency"

                },

                ticks: {

                    maxRotation: 45,

                    minRotation: 45,

                    autoSkip: true,

                    maxTicksLimit: 18,

                    font: {
                        size: 9
                    }

                }

            },

            y: {

                grid: {

                    color:
                        "rgba(148,163,184,.20)"

                },

                title: {

                    display: true,

                    text: "Measurement"

                },

                ticks: {

                    font: {
                        size: 9
                    }

                }

            }

        }

    };

}


/* =========================================================
   GRAPH CONTROLS
========================================================= */

function getChartByCanvasID(
    canvasID
) {

    return charts.find(
        chart =>
            chart.canvas.id
            === canvasID
    );

}


function zoomGraph(
    canvasID,
    amount
) {

    const chart =
        getChartByCanvasID(
            canvasID
        );

    if (!chart) return;

    chart.zoom({
        y: amount
    });

}


function resetGraph(
    canvasID
) {

    const chart =
        getChartByCanvasID(
            canvasID
        );

    if (!chart) return;

    chart.resetZoom();

}


function destroyCharts() {

    charts.forEach(
        chart =>
            chart.destroy()
    );

    charts = [];

}


/* =========================================================
   FORMAT
========================================================= */

function formatGroupName(name) {

    return name

        .replace(
            /^F_MB_/,
            ""
        )

        .replace(
            /_/g,
            " "
        );

}


function formatSingleLabel(
    header
) {

    return header.replace(
        /^F_MB_/,
        ""
    );

}


/* =========================================================
   NUMBER CONVERSION
========================================================= */

function toNumber(value) {

    if (
        value === undefined
        ||
        value === null
    ) {

        return null;

    }

    const text =
        String(value)
        .trim();

    if (
        text === ""
        ||
        text === "-"
        ||
        text.toLowerCase()
        === "nan"
    ) {

        return null;

    }

    const number =
        Number(
            text.replace(
                /,/g,
                ""
            )
        );

    return Number.isNaN(number)
        ? null
        : number;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
