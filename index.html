<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Log Analyzer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #202124;
}

/* =========================
   HEADER
========================= */

header {
    background: #1f2937;
    color: white;
    padding: 18px 25px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    color: #cbd5e1;
    font-size: 13px;
}

/* =========================
   MODEL SELECTION
========================= */

.model-selection {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    flex-wrap: wrap;
}

.model-btn {
    border: none;
    padding: 12px 35px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    background: #e5e7eb;
    color: #374151;
}

.model-btn:hover {
    background: #d1d5db;
}

.model-btn.active {
    background: #2563eb;
    color: white;
}

/* =========================
   MAIN LAYOUT
========================= */

.container {
    display: none;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 90px);
    gap: 0;
}

/* =========================
   LEFT PANEL
========================= */

.sidebar {
    background: white;
    border-right: 1px solid #d1d5db;
    padding: 15px;
    overflow-y: auto;
}

.sidebar h3 {
    margin-top: 0;
}

.upload-area {
    border: 2px dashed #9ca3af;
    border-radius: 10px;
    padding: 25px 15px;
    text-align: center;
    background: #f9fafb;
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 12px;
}

.upload-area:hover,
.upload-area.dragover {
    border-color: #2563eb;
    background: #eff6ff;
}

.upload-icon {
    font-size: 30px;
    margin-bottom: 8px;
}

.upload-text {
    font-weight: bold;
    font-size: 14px;
}

.upload-subtext {
    color: #6b7280;
    margin: 6px 0;
    font-size: 12px;
}

.browse-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.browse-btn:hover {
    background: #1d4ed8;
}

.upload-info {
    margin-top: 10px;
    font-size: 11px;
    color: #6b7280;
}

textarea {
    width: 100%;
    height: 150px;
    resize: vertical;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 10px;
    font-family: monospace;
    font-size: 11px;
}

.analyze-btn {
    width: 100%;
    margin-top: 8px;
    background: #16a34a;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.analyze-btn:hover {
    background: #15803d;
}

/* =========================
   FILTER
========================= */

.filter-row {
    display: flex;
    gap: 5px;
    margin: 12px 0;
}

.filter-btn {
    flex: 1;
    border: none;
    padding: 7px;
    border-radius: 5px;
    cursor: pointer;
    background: #e5e7eb;
    font-size: 12px;
}

.filter-btn.active {
    background: #2563eb;
    color: white;
}

#searchSN {
    width: 100%;
    padding: 9px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin-bottom: 10px;
}

/* =========================
   SN LIST
========================= */

.sn-list {
    border-top: 1px solid #e5e7eb;
}

.sn-item {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    cursor: pointer;
}

.sn-item:hover {
    background: #f3f4f6;
}

.sn-item.active {
    background: #dbeafe;
}

.sn-title {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13px;
}

.good {
    color: #16a34a;
}

.ng {
    color: #dc2626;
}

.sn-info {
    margin-top: 4px;
    font-size: 11px;
    color: #6b7280;
}

/* =========================
   MAIN CONTENT
========================= */

.main {
    overflow-y: auto;
    padding: 20px;
}

.welcome {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    color: #6b7280;
    font-size: 18px;
}

.unit-details {
    background: white;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #e5e7eb;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    font-size: 13px;
}

.detail-box {
    background: #f9fafb;
    padding: 10px;
    border-radius: 6px;
}

.detail-label {
    font-size: 11px;
    color: #6b7280;
}

.detail-value {
    margin-top: 4px;
    font-weight: bold;
}

/* =========================
   GRAPHS
========================= */

.graph-section {
    background: white;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    margin-bottom: 15px;
    padding: 15px;
}

.graph-title {
    margin: 0 0 10px;
    font-size: 16px;
}

.graph-wrapper {
    width: 100%;
    height: 380px;
    position: relative;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   STATION SUMMARY
========================= */

.station-summary {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 15px;
    margin-top: 20px;
}

.station-header {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.station-block {
    margin-top: 15px;
    border-top: 1px solid #e5e7eb;
    padding-top: 15px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px) {

    .container {

        height: auto;
    }

    .sidebar {

        border-bottom: 1px solid #d1d5db;
        max-height: 500px;
    }

}

</div>

/* =====================================================
   MODEL SELECT
===================================================== */

function selectModel(model, button) {

    selectedModel = model;

    document.querySelectorAll(".model-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("appContainer")
        .style.display = "grid";

}


/* =====================================================
   FILE BROWSE + DRAG DROP
===================================================== */

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const browseBtn = document.getElementById("browseBtn");

browseBtn.addEventListener("click", function(e) {

    e.stopPropagation();

    fileInput.click();

});

dropZone.addEventListener("click", function() {

    fileInput.click();

});

fileInput.addEventListener("change", function() {

    if (fileInput.files.length > 0) {

        loadFile(fileInput.files[0]);

    }

});

dropZone.addEventListener("dragover", function(e) {

    e.preventDefault();

    dropZone.classList.add("dragover");

});

dropZone.addEventListener("dragleave", function() {

    dropZone.classList.remove("dragover");

});

dropZone.addEventListener("drop", function(e) {

    e.preventDefault();

    dropZone.classList.remove("dragover");

    if (e.dataTransfer.files.length > 0) {

        loadFile(e.dataTransfer.files[0]);

    }

});


function loadFile(file) {

    const reader = new FileReader();

    reader.onload = function(e) {

        document.getElementById("logInput").value =
            e.target.result;

    };

    reader.readAsText(file);

}


/* =====================================================
   ANALYZE
===================================================== */

function analyzeLogs() {

    if (!selectedModel) {

        alert("Please select XUA4, BLA4, or 2RS4 first.");

        return;

    }

    const raw =
        document.getElementById("logInput").value;

    if (!raw.trim()) {

        alert("Please paste or load an Audio Log.");

        return;

    }

    parsedUnits =
        parseAudioLogs(raw);

    renderSNList();

}


/* =====================================================
   LOG PARSER
===================================================== */

function parseAudioLogs(raw) {

    /*
    Flexible parser.

    This searches for Serial Number,
    StationIP and measurement values.

    Adjust REGEX patterns here if your
    actual production log format changes.
    */

    const units = [];

    const blocks =
        raw.split(/(?=SN\s*[:=]|Serial\s*Number\s*[:=])/i);

    blocks.forEach((block, index) => {

        if (!block.trim())
            return;

        let snMatch =
            block.match(
                /(?:SN|Serial\s*Number)\s*[:=]\s*([^\s,\r\n]+)/i
            );

        let sn =
            snMatch
            ? snMatch[1]
            : "UNKNOWN_" + (index + 1);

        let stationMatch =
            block.match(
                /StationIP\s*[:=]\s*([^\s,\r\n]+)/i
            );

        if (!stationMatch) {

            stationMatch =
                block.match(
                    /Station\s*IP\s*[:=]\s*([^\s,\r\n]+)/i
                );

        }

        let stationIP =
            stationMatch
            ? stationMatch[1]
            : "UNKNOWN";

        const measurements =
            extractMeasurements(block);

        const evaluation =
            evaluateUnit(measurements);

        units.push({

            sn: sn,

            stationIP: stationIP,

            status: evaluation.status,

            ngTypes: evaluation.ngTypes,

            measurements: measurements,

            raw: block

        });

    });

    return units;

}


/* =====================================================
   EXTRACT MEASUREMENTS
===================================================== */

function extractMeasurements(block) {

    const data = {

        speakerFR: [],
        speakerRB: [],
        speakerTHD: [],
        micFR: [],
        micTHD: [],
        micSeal: []

    };

    /*
    Supported generic formats:

    Speaker_FR,100,85.2
    MIC_FR,100,-38.5
    Speaker_THD,400,5.2

    or:

    Speaker_FR 100 85.2

    The parser can be expanded once your
    exact production logs are added.
    */

    const lines =
        block.split(/\r?\n/);

    lines.forEach(line => {

        const clean =
            line.trim();

        if (!clean)
            return;

        let match;

        match =
            clean.match(
                /speaker[_\s-]*fr[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.speakerFR.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }


        match =
            clean.match(
                /speaker[_\s-]*rb[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.speakerRB.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }


        match =
            clean.match(
                /speaker[_\s-]*thd[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.speakerTHD.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }


        match =
            clean.match(
                /mic[_\s-]*fr[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.micFR.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }


        match =
            clean.match(
                /mic[_\s-]*thd[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.micTHD.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }


        match =
            clean.match(
                /mic[_\s-]*seal[^0-9-]*([\d.]+)[,\s]+(-?[\d.]+)/i
            );

        if (match) {

            data.micSeal.push({

                hz: Number(match[1]),

                value: Number(match[2])

            });

            return;

        }

    });

    return data;

}


/* =====================================================
   EVALUATE UNIT
===================================================== */

function evaluateUnit(data) {

    const ngTypes = [];

    const spec =
        SPECS[selectedModel];

    function checkFR(values, limits, name) {

        if (!values.length)
            return;

        if (!limits.lower)
            return;

        for (const item of values) {

            const lower =
                limits.lower[item.hz];

            const upper =
                limits.upper[item.hz];

            if (
                lower !== undefined &&
                item.value < lower
            ) {

                ngTypes.push(
                    name + " BELOW LL"
                );

                break;

            }

            if (
                upper !== undefined &&
                item.value > upper
            ) {

                ngTypes.push(
                    name + " ABOVE UL"
                );

                break;

            }

        }

    }

    checkFR(
        data.speakerFR,
        spec.speakerFR,
        "SPEAKER FR"
    );

    checkFR(
        data.micFR,
        spec.micFR,
        "MIC FR"
    );

    return {

        status:
            ngTypes.length
                ? "NG"
                : "GOOD",

        ngTypes: ngTypes

    };

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(filter, button) {

    currentFilter = filter;

    document.querySelectorAll(".filter-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderSNList();

}


/* =====================================================
   RENDER SN LIST
===================================================== */

function renderSNList() {

    const list =
        document.getElementById("snList");

    const search =
        document.getElementById("searchSN")
        .value
        .trim()
        .toLowerCase();

    const searchTerms =
        search
        .split(/[,\s]+/)
        .filter(Boolean);

    list.innerHTML = "";

    parsedUnits.forEach(unit => {

        if (
            currentFilter !== "ALL" &&
            unit.status !== currentFilter
        )
            return;

        if (searchTerms.length) {

            const match =
                searchTerms.some(term =>
                    unit.sn
                    .toLowerCase()
                    .includes(term)
                );

            if (!match)
                return;

        }

        const item =
            document.createElement("div");

        item.className =
            "sn-item" +
            (
                activeSN === unit.sn
                ? " active"
                : ""
            );

        item.onclick =
            () => showUnit(unit.sn);

        const ngText =
            unit.ngTypes.length
            ? unit.ngTypes.join(", ")
            : "PASS";

        item.innerHTML = `

            <div class="sn-title">

                <span>${unit.sn}</span>

                <span class="${
                    unit.status === "GOOD"
                    ? "good"
                    : "ng"
                }">

                    ${unit.status}

                </span>

            </div>

            <div class="sn-info">

                StationIP:
                ${unit.stationIP}

            </div>

            <div class="sn-info">

                ${ngText}

            </div>

        `;

        list.appendChild(item);

    });

}


/* =====================================================
   SHOW UNIT
===================================================== */

function showUnit(sn) {

    activeSN = sn;

    charts.forEach(chart =>
        chart.destroy()
    );

    charts = [];

    const unit =
        parsedUnits.find(
            x => x.sn === sn
        );

    if (!unit)
        return;

    renderSNList();

    const main =
        document.getElementById("mainContent");

    main.innerHTML = "";

    const details =
        document.createElement("div");

    details.className =
        "unit-details";

    details.innerHTML = `

        <h2>${unit.sn}</h2>

        <div class="details-grid">

            <div class="detail-box">

                <div class="detail-label">
                    MODEL
                </div>

                <div class="detail-value">
                    ${selectedModel}
                </div>

            </div>

            <div class="detail-box">

                <div class="detail-label">
                    STATUS
                </div>

                <div class="detail-value ${
                    unit.status === "GOOD"
                    ? "good"
                    : "ng"
                }">

                    ${unit.status}

                </div>

            </div>

            <div class="detail-box">

                <div class="detail-label">
                    STATION IP
                </div>

                <div class="detail-value">
                    ${unit.stationIP}
                </div>

            </div>

            <div class="detail-box">

                <div class="detail-label">
                    NG TYPE
                </div>

                <div class="detail-value">

                    ${
                        unit.ngTypes.length
                        ? unit.ngTypes.join(", ")
                        : "PASS"
                    }

                </div>

            </div>

        </div>

    `;

    main.appendChild(details);


    createGraph(
        main,
        "Speaker Frequency Response",
        unit.measurements.speakerFR,
        "speakerFR"
    );

    createGraph(
        main,
        "Speaker RB",
        unit.measurements.speakerRB,
        "speakerRB"
    );

    createGraph(
        main,
        "Speaker THD",
        unit.measurements.speakerTHD,
        "speakerTHD"
    );

    createGraph(
        main,
        "Mic Frequency Response",
        unit.measurements.micFR,
        "micFR"
    );

    createGraph(
        main,
        "Mic THD",
        unit.measurements.micTHD,
        "micTHD"
    );

    createGraph(
        main,
        "Mic Sealing",
        unit.measurements.micSeal,
        "micSeal"
    );

}


/* =====================================================
   CREATE GRAPH
===================================================== */

function createGraph(
    container,
    title,
    data,
    type
) {

    /*
    If no data,
    DO NOT create graph.
    */

    if (!data || !data.length)
        return;

    const section =
        document.createElement("div");

    section.className =
        "graph-section";

    const heading =
        document.createElement("h3");

    heading.className =
        "graph-title";

    heading.textContent =
        title;

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "graph-wrapper";

    const canvas =
        document.createElement("canvas");

    wrapper.appendChild(canvas);

    section.appendChild(heading);

    section.appendChild(wrapper);

    container.appendChild(section);


    const labels =
        data.map(x => x.hz);

    const values =
        data.map(x => x.value);


    const datasets = [

        {

            label: title,

            data: values,

            borderWidth: 2,

            tension: 0,

            pointRadius: 0

        }

    ];


    const spec =
        SPECS[selectedModel];


    /*
    FR LIMITS
    */

    if (
        type === "speakerFR" ||
        type === "micFR"
    ) {

        const limits =
            spec[type];

        if (
            limits &&
            limits.lower &&
            Object.keys(limits.lower).length
        ) {

            datasets.push({

                label: "LL",

                data:
                    labels.map(
                        hz =>
                            limits.lower[hz]
                            ?? null
                    ),

                borderWidth: 2,

                pointRadius: 0,

                tension: 0

            });

        }


        if (
            limits &&
            limits.upper &&
            Object.keys(limits.upper).length
        ) {

            datasets.push({

                label: "UL",

                data:
                    labels.map(
                        hz =>
                            limits.upper[hz]
                            ?? null
                    ),

                borderWidth: 2,

                pointRadius: 0,

                tension: 0

            });

        }

    }


    /*
    MIC SEAL
    */

    if (
        type === "micSeal" &&
        spec.micSeal
    ) {

        datasets.push({

            label: "LL",

            data:
                labels.map(
                    hz =>
                        hz >= 200
                        ? spec.micSeal.lower
                        : null
                ),

            borderWidth: 2,

            pointRadius: 0,

            tension: 0

        });


        datasets.push({

            label: "UL",

            data:
                labels.map(
                    hz =>
                        spec.micSeal.upper
                ),

            borderWidth: 2,

            pointRadius: 0,

            tension: 0

        });

    }


    const chart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        intersect: false,

                        mode: "index"

                    },

                    scales: {

                        x: {

                            title: {

                                display: true,

                                text: "Frequency (Hz)"

                            }

                        },

                        y: {

                            title: {

                                display: true,

                                text: "Value"

                            }

                        }

                    },

                    plugins: {

                        legend: {

                            display: true

                        },

                        zoom: {

                            pan: {

                                enabled: true,

                                mode: "y"

                            },

                            zoom: {

                                wheel: {

                                    enabled: true

                                },

                                pinch: {

                                    enabled: true

                                },

                                mode: "y"

                            }

                        }

                    }

                }

            }
        );


    charts.push(chart);

}
